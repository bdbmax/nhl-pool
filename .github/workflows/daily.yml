# Daily pool update: real points, updated projections and odds, then publish the site to GitHub Pages.
# Runs at 5:30 in Toronto year-round, with retries at 6:30 and 7:30 if the 5:30 update did not get saved
# (a source down, NHL stats late), plus an evening update at 22:00 that adds the day's finished games to
# the site (the morning run stays the official record in data/history). GitHub cron has no time zones, so
# it is scheduled at every possible UTC hour and scripts/gate.py keeps the right runs. Scheduled runs can
# start 5 to 30 minutes late.
name: Daily update

on:
  schedule:
    - cron: "30 9 * * *"
    - cron: "30 10 * * *"
    - cron: "30 11 * * *"
    - cron: "30 12 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (official, writes history) or evening (adds today's finished games)"
        type: choice
        options: [morning, evening]
        default: morning

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            data/history
            scripts
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/gate.py data/history >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Yesterday's downloads: a fallback if a source is down this morning (every source is re-fetched).
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: uv sync

      - name: Real points, projections, odds, history
        run: uv run python -m nhlpool.daily ${{ needs.gate.outputs.mode == 'evening' && '--evening' || '' }}

      - name: Tests
        run: uv run pytest -q tests/test_site_ids.py tests/test_scoring.py tests/test_daily.py tests/test_gate.py

      - name: Build the site
        working-directory: site
        env:
          BASE_PATH: ""  # served at the root of https://nhlpool.ca
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          npm run build
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

      # Handed to the save job, which commits only once the site is live (so a retry still runs if
      # publishing fails).
      - uses: actions/upload-artifact@v4
        with:
          name: daily-data
          path: |
            data/history
            site/data/pool.json

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  save:
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: daily-data
          path: .
      - name: Commit history and site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history site/data/pool.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "${{ needs.gate.outputs.mode == 'evening' && 'Evening' || 'Daily' }} update $(TZ=America/Toronto date +%F)"
          git pull --rebase
          git push
