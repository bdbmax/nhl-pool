# Daily pool update: real points, updated projections and odds, then publish the site to GitHub Pages.
# The official morning run starts at 5:33 Toronto time, with retries when history is missing.
# Same-day updates add finished games every half hour from noon through 1:35 the next morning.
name: Daily update

on:
  schedule:
    - cron: "33 5 * * *"
      timezone: America/Toronto
    - cron: "33 6 * * *"
      timezone: America/Toronto
    - cron: "33 7 * * *"
      timezone: America/Toronto
    - cron: "33 11 * * *"
      timezone: America/Toronto
    - cron: "5,35 12 * * *"
      timezone: America/Toronto
    - cron: "5,35 13 * * *"
      timezone: America/Toronto
    - cron: "5,35 14 * * *"
      timezone: America/Toronto
    - cron: "5,35 15 * * *"
      timezone: America/Toronto
    - cron: "5,35 16 * * *"
      timezone: America/Toronto
    - cron: "5,35 17 * * *"
      timezone: America/Toronto
    - cron: "5,35 18 * * *"
      timezone: America/Toronto
    - cron: "5,35 19 * * *"
      timezone: America/Toronto
    - cron: "5,35 20 * * *"
      timezone: America/Toronto
    - cron: "5,35 21 * * *"
      timezone: America/Toronto
    - cron: "5,35 22 * * *"
      timezone: America/Toronto
    - cron: "5,35 23 * * *"
      timezone: America/Toronto
    - cron: "5,35 0 * * *"
      timezone: America/Toronto
    - cron: "5,35 1 * * *"
      timezone: America/Toronto
  workflow_dispatch:
    inputs:
      mode:
        description: "morning (official, writes history) or evening (adds today's finished games)"
        type: choice
        options: [morning, evening]
        default: morning

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          sparse-checkout: |
            data/history
            scripts
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: python3 scripts/gate.py data/history >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Yesterday's downloads: a fallback if a source is down this morning (every source is re-fetched).
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-

      - run: uv sync --locked

      - name: Real points, projections, odds, history
        run: uv run python -m nhlpool.daily ${{ needs.gate.outputs.mode == 'evening' && '--evening' || '' }}

      - name: Tests
        run: uv run pytest -q tests/test_site_ids.py tests/test_scoring.py tests/test_daily.py tests/test_gate.py tests/test_nhl_api.py

      - name: Build the site
        working-directory: site
        env:
          BASE_PATH: ""  # served at the root of https://nhlpool.ca
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          npm ci
          # The build downloads the Google fonts; retry a network hiccup instead of failing the morning.
          for attempt in 1 2 3; do npm run build && break; [ "$attempt" = 3 ] && exit 1; echo "build failed, retrying"; sleep 20; done
          touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/out

      # Handed to the save job, which commits only once the site is live (so a retry still runs if
      # publishing fails).
      - uses: actions/upload-artifact@v4
        with:
          name: daily-data
          retention-days: 2
          path: |
            data/history
            site/data/pool.json

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  save:
    needs: [gate, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: daily-data
          path: .
      - name: Commit history and site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history site/data/pool.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "${{ needs.gate.outputs.mode == 'evening' && 'Evening' || 'Daily' }} update $(TZ=America/Toronto date +%F)"
          git pull --rebase
          git push
