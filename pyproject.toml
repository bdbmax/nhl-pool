[project]
name = "nhlpool"
version = "0.1.0"
description = "Draft-and-hold fantasy hockey projections and draft board"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhlpool"]
